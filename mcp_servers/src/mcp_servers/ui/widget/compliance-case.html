<html>
  <script>(function(){var d=document.documentElement,m=matchMedia('(prefers-color-scheme:dark)');function t(){if(!d.dataset.theme)d.dataset.theme=m.matches?'dark':'light';}t();m.addEventListener('change',function(){if(!d.getAttribute('data-theme'))t();});new MutationObserver(function(){}).observe(d,{attributes:true,attributeFilter:['data-theme']});})()</script>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0b0f14;
        --card: #151a21;
        --muted: #a9b1bd;
        --text: #e6edf3;
        --accent: #4cc2ff;
        --border: #1f2630;
        --pos: #2bd48f;
        --neg: #ff6b6b;
        --warn: #f0b232;
        --input-bg: #0f131a;
        --btn-bg: #152235;
        --btn-border: #243145;
        --btn-primary-bg: linear-gradient(135deg, #1a6dff, #4cc2ff);
        --btn-primary-border: #2a80ff;
        --success-border: #1a5a3a;
        --success-glow: rgba(43,212,143,.16);
        --error-bg: rgba(255,107,107,.08);
        --error-border: rgba(255,107,107,.25);
        --compliance-accent: #9966cc;
        --compliance-glow: rgba(153,102,204,.12);
      }
      :root[data-theme="light"] {
          --bg: #f5f5f5;
          --card: #ffffff;
          --muted: #65707d;
          --text: #1e1e1e;
          --accent: #0078d4;
          --border: #e0e0e0;
          --pos: #107c10;
          --neg: #d13438;
          --warn: #ca5010;
          --input-bg: #ffffff;
          --btn-bg: #f0f0f0;
          --btn-border: #d0d0d0;
          --btn-primary-bg: linear-gradient(135deg, #0078d4, #4cc2ff);
          --btn-primary-border: #0078d4;
          --success-border: #107c10;
          --success-glow: rgba(16,124,16,.08);
          --error-bg: rgba(209,52,56,.06);
          --error-border: rgba(209,52,56,.25);
          --compliance-accent: #7b2d8e;
          --compliance-glow: rgba(123,45,142,.08);
      }
      html, body { height: 100%; background: var(--bg); }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .wrap { padding: 16px; min-height: 100%; box-sizing: border-box; }
      .header {
        display: flex; align-items: center;
        justify-content: space-between; margin-bottom: 14px;
      }
      .header-left { display: flex; align-items: center; gap: 10px; }
      .compliance-icon {
        width: 32px; height: 32px; border-radius: 8px;
        background: var(--compliance-glow);
        border: 1px solid var(--compliance-accent);
        display: flex; align-items: center; justify-content: center;
      }
      .title { font-size: 16px; font-weight: 600; }
      .subtitle { color: var(--muted); font-size: 12px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px; padding: 18px;
      }
      .section-label {
        font-size: 11px; color: var(--compliance-accent); text-transform: uppercase;
        letter-spacing: .8px; font-weight: 600; margin-bottom: 10px;
        padding-bottom: 6px; border-bottom: 1px solid var(--border);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .full-width { grid-column: 1 / -1; }
      .field label {
        display: block; font-size: 11px; color: var(--muted);
        text-transform: uppercase; letter-spacing: .5px;
        margin-bottom: 4px;
      }
      .field input, .field select, .field textarea {
        width: 100%; box-sizing: border-box;
        background: var(--input-bg); color: var(--text);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 8px 10px; font-size: 13px; outline: none;
        font-family: inherit;
      }
      .field input:focus, .field select:focus, .field textarea:focus {
        border-color: var(--accent);
      }
      .field textarea { resize: vertical; }
      .field select option { background: var(--card); color: var(--text); }
      .actions { margin-top: 14px; display: flex; gap: 8px; }
      .btn {
        background: var(--btn-bg); color: var(--text);
        border: 1px solid var(--btn-border); border-radius: 8px;
        padding: 8px 16px; font-size: 12px; cursor: pointer;
      }
      .btn-primary {
        background: var(--btn-primary-bg);
        border-color: var(--btn-primary-border); font-weight: 600;
      }
      .btn:disabled { opacity: .5; cursor: default; }
      .success-card {
        background: radial-gradient(600px 200px at 10% -10%,
          var(--success-glow), transparent 55%), var(--card);
        border: 1px solid var(--success-border); border-radius: 14px; padding: 18px;
      }
      .success-card h3 { margin: 0 0 8px; color: var(--pos); font-size: 14px; }
      .success-card .meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
      .success-card .meta strong { color: var(--text); }
      .error-msg {
        margin-top: 10px; padding: 10px; border-radius: 8px;
        background: var(--error-bg); border: 1px solid var(--error-border);
        font-size: 12px; color: var(--neg);
      }
      .success-msg {
        margin-top: 10px; padding: 10px; border-radius: 8px;
        background: var(--success-glow); border: 1px solid var(--success-border);
        font-size: 12px; color: var(--pos);
      }
      .info-banner {
        background: var(--compliance-glow);
        border: 1px solid var(--compliance-accent);
        border-radius: 10px; padding: 10px 14px;
        margin-bottom: 14px; font-size: 12px; color: var(--text);
        display: flex; align-items: flex-start; gap: 8px;
      }
      .info-banner .icon { font-size: 16px; flex-shrink: 0; }
      .info-banner a { color: var(--compliance-accent); text-decoration: none; }
      .info-banner a:hover { text-decoration: underline; }
      .priority-chip {
        display: inline-block; padding: 2px 8px; border-radius: 6px;
        font-size: 10px; font-weight: 600; text-transform: uppercase;
      }
      .priority-chip.high { background: rgba(255,107,107,.15); color: var(--neg); border: 1px solid var(--neg); }
      .priority-chip.medium { background: rgba(240,178,50,.12); color: var(--warn); border: 1px solid var(--warn); }
      .priority-chip.low { background: rgba(43,212,143,.12); color: var(--pos); border: 1px solid var(--pos); }
      .footer {
        margin-top: 12px; font-size: 11px; color: var(--muted); text-align: right;
      }
      .maximize-btn {
        background: transparent; color: var(--muted);
        border: 1px solid var(--border); border-radius: 8px;
        padding: 4px 8px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: color .15s, border-color .15s;
      }
      .maximize-btn:hover { color: var(--accent); border-color: var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="header-left">
          <div class="compliance-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--compliance-accent)">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <div>
            <div class="title" id="pageTitle">Raise Compliance Case</div>
            <div class="subtitle" id="pageSubtitle">Salesforce &middot; Compliance</div>
          </div>
        </div>
        <button class="maximize-btn" id="maximizeBtn" title="Maximize"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2h4v4M6 14H2v-4M14 2L9.5 6.5M2 14l4.5-4.5"/></svg></button>
      </div>

      <div class="info-banner">
        <span class="icon">&#x1f6e1;&#xfe0f;</span>
        <div>
          All compliance matters are confidential and handled in accordance with regulatory obligations.
          Refer to <a href="https://microsoft.sharepoint-df.com/teams/ContosoCompliance" target="_blank">Contoso Compliance Procedures</a> for guidance.
        </div>
      </div>

      <div id="formView">
        <div class="card">
          <div class="section-label">Compliance Case Details</div>
          <div class="form-grid">
            <div class="field full-width">
              <label for="compliance_type">Compliance Category *</label>
              <select id="compliance_type">
                <option value="">-- Select category --</option>
                <option value="AML / KYC">AML / KYC</option>
                <option value="Sanctions Screening">Sanctions Screening</option>
                <option value="Fraud Investigation">Fraud Investigation</option>
                <option value="Market Abuse / Insider Trading">Market Abuse / Insider Trading</option>
                <option value="Data Privacy (GDPR / CCPA)">Data Privacy (GDPR / CCPA)</option>
                <option value="Regulatory Reporting">Regulatory Reporting</option>
                <option value="Conflicts of Interest">Conflicts of Interest</option>
                <option value="Gifts & Entertainment">Gifts &amp; Entertainment</option>
                <option value="Whistleblower Report">Whistleblower Report</option>
                <option value="Trade Surveillance">Trade Surveillance</option>
                <option value="Customer Complaint">Customer Complaint</option>
                <option value="Policy Breach">Policy Breach</option>
                <option value="Third-Party / Vendor Risk">Third-Party / Vendor Risk</option>
                <option value="Operational Risk Event">Operational Risk Event</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="priority">Priority</label>
              <select id="priority">
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Low">Low</option>
              </select>
            </div>
            <div class="field">
              <label for="status">Status</label>
              <select id="status">
                <option value="New">New</option>
                <option value="Working">Working</option>
                <option value="Escalated">Escalated</option>
                <option value="Closed">Closed</option>
              </select>
            </div>
            <div class="field full-width">
              <label for="subject">Subject *</label>
              <input id="subject" type="text" placeholder="Brief summary of the compliance concern" />
            </div>
            <div class="field full-width">
              <label for="description">Description</label>
              <textarea id="description" rows="4" placeholder="Provide a detailed description of the compliance matter, including relevant dates, entities, transactions, or policy references."></textarea>
            </div>
            <div class="field full-width">
              <label for="comment">Comment</label>
              <textarea id="comment" rows="2" placeholder="Additional notes for the Compliance team"></textarea>
            </div>
          </div>
          <div id="errorMsg"></div>
          <div class="actions">
            <button class="btn btn-primary" id="submitBtn" disabled>Raise Case</button>
            <button class="btn" id="resetBtn">Reset</button>
          </div>
        </div>
      </div>

      <div id="successView" style="display:none;"></div>
      <div class="footer">Powered by <strong>salesforce / create_case</strong> via MCP</div>
    </div>

    <script>
      /* ---- Data access (Skybridge pattern) ---- */
      var toolInput  = (window.openai && window.openai.toolInput)  || {};
      var toolOutput = (window.openai && window.openai.toolOutput) || {};

      function esc(s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

      /* ---- Form elements ---- */
      var compTypeEl   = document.getElementById("compliance_type");
      var priorityEl   = document.getElementById("priority");
      var statusEl     = document.getElementById("status");
      var subjectEl    = document.getElementById("subject");
      var descEl       = document.getElementById("description");
      var commentEl    = document.getElementById("comment");
      var submitBtn    = document.getElementById("submitBtn");
      var resetBtn     = document.getElementById("resetBtn");
      var errorMsg     = document.getElementById("errorMsg");
      var formView     = document.getElementById("formView");
      var successView  = document.getElementById("successView");
      var isUpdate     = false;
      var currentCaseId = null;

      function reportHeight() {
        if (window.openai && typeof window.openai.notifyIntrinsicHeight === "function") {
          window.openai.notifyIntrinsicHeight(document.body.scrollHeight);
        }
      }

      function validate() {
        submitBtn.disabled = !(compTypeEl.value && subjectEl.value.trim());
      }
      [compTypeEl, subjectEl].forEach(function(el) {
        el.addEventListener("input", validate);
        el.addEventListener("change", validate);
      });

      resetBtn.addEventListener("click", function() {
        compTypeEl.value = "";
        priorityEl.value = "Medium";
        statusEl.value = "New";
        subjectEl.value = "";
        descEl.value = "";
        commentEl.value = "";
        errorMsg.innerHTML = "";
        isUpdate = false;
        currentCaseId = null;
        submitBtn.textContent = "Raise Case";
        document.getElementById("pageTitle").textContent = "Raise Compliance Case";
        document.getElementById("pageSubtitle").textContent = "Salesforce \u00b7 Compliance";
        submitBtn.disabled = true;
        reportHeight();
      });

      submitBtn.addEventListener("click", async function() {
        if (!window.openai || typeof window.openai.callTool !== "function") return;
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting\u2026";
        errorMsg.innerHTML = "";

        try {
          var output;
          if (isUpdate && currentCaseId) {
            /* Update existing case */
            var updateArgs = { case_id: currentCaseId };
            if (statusEl.value) updateArgs.status = statusEl.value;
            if (priorityEl.value) updateArgs.priority = priorityEl.value;
            if (descEl.value.trim()) updateArgs.description = descEl.value.trim();
            if (subjectEl.value.trim()) updateArgs.subject = subjectEl.value.trim();
            if (compTypeEl.value) updateArgs.compliance_type = compTypeEl.value;
            if (commentEl.value.trim()) updateArgs.comment = commentEl.value.trim();

            output = await window.openai.callTool("update_case", updateArgs);
            var data = output;
            if (output && output.structuredContent) data = output.structuredContent;
            if (!data || !data.success) {
              throw new Error((data && data.error) || "Case update failed");
            }
            errorMsg.innerHTML = '<div class="success-msg">\u2713 Case updated successfully.</div>';
          } else {
            /* Create new case */
            var args = {
              subject: subjectEl.value.trim(),
              compliance_type: compTypeEl.value,
              priority: priorityEl.value || "Medium",
            };
            if (descEl.value.trim()) args.description = descEl.value.trim();
            if (commentEl.value.trim()) args.reason = commentEl.value.trim();

            output = await window.openai.callTool("create_case", args);
            var data = output;
            if (output && output.structuredContent) data = output.structuredContent;
            if (!data || !data.created) {
              throw new Error((data && data.error) || "Case creation failed");
            }

            /* Switch to update mode */
            var c = data.case || {};
            isUpdate = true;
            currentCaseId = c.id;
            document.getElementById("pageTitle").textContent = "Update Compliance Case";
            document.getElementById("pageSubtitle").textContent = "Salesforce \u00b7 " + (c.case_number || "Case");
            errorMsg.innerHTML = '<div class="success-msg">\u2713 Case <strong>' + esc(c.case_number || "") + '</strong> created and assigned to Compliance.</div>';
          }
        } catch (err) {
          errorMsg.innerHTML = '<div class="error-msg">' + esc(err.message || "Operation failed") + '</div>';
        } finally {
          submitBtn.textContent = isUpdate ? "Update Case" : "Raise Case";
          validate();
          reportHeight();
        }
      });

      /* ---- Display Mode (maximize / restore) ---- */
      var _expandSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2h4v4M6 14H2v-4M14 2L9.5 6.5M2 14l4.5-4.5"/></svg>';
      var _collapseSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 6h-4V2M2 10h4v4M10 6l4.5-4.5M6 10L1.5 14.5"/></svg>';
      var _isFullscreen = false;
      var _maxBtn = document.getElementById("maximizeBtn");

      async function toggleFullscreen() {
        if (!window.openai || typeof window.openai.requestDisplayMode !== "function") return;
        var mode = _isFullscreen ? "inline" : "fullscreen";
        try {
          await window.openai.requestDisplayMode({ mode: mode });
          _isFullscreen = !_isFullscreen;
          _maxBtn.innerHTML = _isFullscreen ? _collapseSvg : _expandSvg;
          _maxBtn.title = _isFullscreen ? "Restore" : "Maximize";
          reportHeight();
        } catch (e) { /* host denied */ }
      }

      if (_maxBtn) {
        if (window.openai && typeof window.openai.requestDisplayMode === "function") {
          _maxBtn.addEventListener("click", toggleFullscreen);
        } else {
          _maxBtn.style.display = "none";
        }
      }

      /* ---- Detect update mode from toolOutput ---- */
      var existingCase = toolOutput.case || toolOutput;
      isUpdate = !!(existingCase && (existingCase.id || existingCase.case_number));
      if (isUpdate) {
        currentCaseId = existingCase.id;
        submitBtn.textContent = "Update Case";
        document.getElementById("pageTitle").textContent = "Update Compliance Case";
        document.getElementById("pageSubtitle").textContent = "Salesforce \u00b7 " + (existingCase.case_number || "Case");
      }

      /* ---- Pre-populate from toolInput / toolOutput ---- */
      var inp = isUpdate
        ? Object.assign({}, existingCase, toolInput)
        : toolInput;
      if (inp.compliance_type || inp.type) compTypeEl.value = inp.compliance_type || inp.type || "";
      if (inp.subject) subjectEl.value = inp.subject;
      if (inp.description) descEl.value = inp.description;
      if (inp.priority) priorityEl.value = inp.priority;
      if (inp.status) statusEl.value = inp.status;

      validate();
      reportHeight();
    </script>
  </body>
</html>
