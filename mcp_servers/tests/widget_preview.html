const WIDGET_FILES = {
  "task-list": "src/mcp_servers/ui/widget/task-list.html",
  "approval-review": "src/mcp_servers/ui/widget/approval-review.html",
  "worker-profile": "src/mcp_servers/ui/widget/worker-profile.html",

  "create-incident": "src/mcp_servers/ui/widget/create-incident.html",
  "leave-booking": "src/mcp_servers/ui/widget/leave-booking.html",
  "compliance-case": "src/mcp_servers/ui/widget/compliance-case.html",
  "jira-issue": "src/mcp_servers/ui/widget/jira-issue.html",
  "jira-issue-create": "src/mcp_servers/ui/widget/jira-issue.html",
  "catalog-item": "src/mcp_servers/ui/widget/catalog-item.html",
  "update-incident": "src/mcp_servers/ui/widget/update-incident.html",

  "crm-pipeline": "src/mcp_servers/ui/widget/crm-pipeline.html",
  "crm-opportunity": "src/mcp_servers/ui/widget/crm-opportunity.html",
  "crm-event": "src/mcp_servers/ui/widget/crm-event.html",
};

const frame = document.getElementById("widget-frame");
const statusEl = document.getElementById("status");

function loadWidget(name) {
  // Update active tab
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.widget === name));

  // Read the HTML file and inject mock openai globals
  const filePath = WIDGET_FILES[name];
  fetch(`/widget-file?path=${encodeURIComponent(filePath)}`)
    .then(r => {
      if (!r.ok) throw new Error(`${r.status} loading ${filePath}`);
      return r.text();
    })
    .then(html => {
      const mockEntry = MOCK_DATA[name] || {};
      // Support either { toolOutput: {...}, toolInput: {...} } or a flat toolOutput-only object
      const hasToolInput = 'toolInput' in mockEntry || 'toolOutput' in mockEntry;
      const toolOutput = hasToolInput ? (mockEntry.toolOutput || {}) : mockEntry;
      const toolInput = mockEntry.toolInput || {};
      // Inject the mock window.openai before the widget's own scripts
      const injection = `<script>
        window.openai = {
          toolInput: ${JSON.stringify(toolInput)},
          toolOutput: ${JSON.stringify(toolOutput)},
          callTool: function(name, args) {
            console.log('[Mock callTool]', name, JSON.stringify(args));
            // Catalog-aware mock responses
            if (name === 'search_reference_values') {
              return new Promise(function(r) { setTimeout(function() {
                r({ results: [
                  { sys_id: 'loc_001', name: 'Tulgey Wood – Sector Alpha' },
                  { sys_id: 'loc_002', name: 'Tulgey Wood – Sector Bravo' },
                  { sys_id: 'loc_003', name: 'Tumtum Tree Clearing' },
                  { sys_id: 'loc_004', name: 'Borogove Meadow' },
                  { sys_id: 'loc_005', name: 'Mimsy Outpost' },
                ].filter(function(i) { return i.name.toLowerCase().indexOf((args.search || '').toLowerCase()) >= 0; }) });
              }, 400); });
            }
            if (name === 'get_cart') {
              return Promise.resolve({ items: [], subtotal: '$0.00' });
            }
            if (name === 'order_catalog_item') {
              return new Promise(function(r) { setTimeout(function() {
                r({ success: true, request_number: 'REQ0041234', request_id: 'mock_req_id', link: '#' });
              }, 800); });
            }
            if (name === 'add_to_cart') {
              return new Promise(function(r) { setTimeout(function() {
                r({ success: true, cart_item_id: 'mock_cart_001' });
              }, 500); });
            }
            if (name === 'update_incident') {
              return new Promise(function(r) { setTimeout(function() {
                r({ success: true, number: args.number, updated: args });
              }, 600); });
            }
            if (name === 'update_task') {
              return new Promise(function(r) { setTimeout(function() {
                r({ success: true, task: Object.assign({ Id: args.task_id, Subject: 'Updated Task', Status: 'In Progress', Priority: 'Normal' }, args) });
              }, 600); });
            }
            if (name === 'create_project') {
              return new Promise(function(r) { setTimeout(function() {
                r({ success: true, project: { key: args.key, name: args.name, url: '#', id: 'mock-proj-001' } });
              }, 700); });
            }
            if (name === 'change_business_title') {
              return new Promise(function(r) { setTimeout(function() {
                r({ success: true, newTitle: args.proposedBusinessTitle });
              }, 500); });
            }
            if (name === 'create_opportunity') {
              return new Promise(function(r) { setTimeout(function() {
                r({ success: true, id: '006xx' + Date.now(), name: args.name || 'New Opportunity', url: '#', stage: args.stage_name || 'Prospecting' });
              }, 700); });
            }
            if (name === 'create_opportunity_task') {
              return new Promise(function(r) { setTimeout(function() {
                r({ success: true, id: '00T' + Date.now(), subject: args.subject || 'New Task', status: 'Not Started' });
              }, 500); });
            }
            if (name === 'create_event') {
              return new Promise(function(r) { setTimeout(function() {
                r({ success: true, id: '00U' + Date.now(), subject: args.subject || 'New Event', url: '#' });
              }, 700); });
            }
            if (name === 'get_catalog_item') {
              return new Promise(function(r) { setTimeout(function() {
                r({ sys_id: args.sys_id, name: 'Catalog Item', picture: 'https://placehold.co/80x60/1a1a2e/22d3ee.png?text=Item', short_description: 'Loaded details.' });
              }, 400); });
            }
            // Default
            var msg = 'Mock callTool: ' + name + '(' + JSON.stringify(args) + ')';
            alert(msg);
            return Promise.resolve({ status: 'mocked' });
          },
          sendFollowUpMessage: function(msg) {
            console.log('[Mock sendFollowUpMessage]', msg);
          },
          notifyIntrinsicHeight: function(h) { /* no-op in preview */ },
          requestDisplayMode: function(opts) {
            console.log('[Mock requestDisplayMode]', opts);
            return Promise.resolve();
          },
        };
      <\/script>`;
      // Insert injection right after <head>, and set data-theme on <html> to control the widget theme
      let injectedHtml = html.replace(/<head[^>]*>/i, '$&' + injection);
      injectedHtml = injectedHtml.replace(/<html[^>]*>/i, `<html data-theme="${currentTheme}">`);
      frame.srcdoc = injectedHtml;
      statusEl.textContent = `Loaded: ${name}`;
    })
    .catch(err => {
      statusEl.textContent = `Error: ${err.message}`;
      frame.srcdoc = `<pre style="color:red;padding:20px">${err.message}</pre>`;
    });
}

// Tab click handler
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => loadWidget(tab.dataset.widget));
});

// Load first widget
loadWidget("task-list");
